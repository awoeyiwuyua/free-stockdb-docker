# free-stockdb 极空间 Q4 Docker 部署（0.5.0 单镜像，一个容器）
#
# 用法：
#   首次部署见 docker/README.md。核心命令：
#     1. 首次同步数据：  容器启动前设 STOCKDB_SYNC_FIRST=1（见下），或
#                        启动后浏览器 http://<NAS_IP>:8081 点「立即热更新」
#     2. 启动服务：      docker compose up -d stockdb
#     3. 查看日志：      docker compose logs -f stockdb
#     4. 日常增量更新：  浏览器打开 http://<NAS_IP>:8081 点「立即热更新」
#                        （网页一键同步，无需 SSH/终端）
#
# 数据持久化（升级/重建容器不丢数据）：
#   ./data  全市场行情库（日K/分钟K/tick）+ stockdb.conf + 同步日志，必须持久化
#   ./mydb  私有数据库（发行包内置目录）
#
# 端口：
#   7899  stockdb HTTP 行情 API（局域网 http://<NAS_IP>:7899）
#   8081  webui 运维面板（同步管理 / 健康监控 / 私有存储 / AI 查询 /mcp 路由）

services:
  stockdb:
    # 镜像 tag = 上游 stockdb 发布包版本（当前 0.3.1），即单镜像构建（含 webui 0.5.0 功能）。
    # :latest 指向最新构建；如要固定版本回滚可改为 :0.3.1
    image: ghcr.io/awoeyiwuyua/stockdb-ai:latest
    container_name: stockdb
    restart: unless-stopped
    ports:
      - "7899:7899"
      - "8081:8080"
    volumes:
      - ./data:/data
      - ./mydb:/mydb
    environment:
      TZ: Asia/Shanghai
      # 极空间无终端首次部署：取消注释并设为 1，容器启动时先增量同步再启动服务
      # STOCKDB_SYNC_FIRST: "1"
    healthcheck:
      # 0.5.0 amd64 运行时是 Debian slim，无 wget → 用镜像内置 curl；
      # 中文表名必须 URL 编码（%E8%82%A1...=股票代码），与 webui 内部 quote 一致
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:7899/?cmd=get&t=%E8%82%A1%E7%A5%A8%E4%BB%A3%E7%A0%81' >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - stockdb-net

networks:
  stockdb-net:
    driver: bridge
