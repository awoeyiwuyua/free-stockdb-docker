# stockdb 容器内配置文件（覆盖发行包默认）
#
# 与发行包默认的差异：
#   - server.ip = 0.0.0.0（容器内必须监听所有接口才能被 Docker 端口映射对外暴露）
#   - pidfile / log 使用绝对路径落到 /data 卷（镜像层只读，相对路径会写失败）
#
# 数据目录为发行版硬编码绝对路径 /data（行情）与 /mydb（私有库），
# 由 compose 挂载卷持久化，不在此文件配置。
#
# 注意：
#   - 本文件会拷贝到 /data/stockdb.conf，之后用户可直接编辑卷内文件。
#   - auth 开启后，HTTP/MCP 客户端需携带密码；readonly 强制只读。

# stock config
# Indent nested config with tabs.

work_dir = /data
pidfile = /data/stockdb.pid

server:
	port: 7899
	ip: 0.0.0.0
	#auth: this-is-a-very-strong-password-32ch
	#readonly: yes
	#slowlog_timeout: 5

replication:
	binlog: yes
	sync_speed: -1

logger:
	level: warn
	output: /data/log.txt
	rotate:
		size: 1000000000

leveldb:
	cache_size: 500
	write_buffer_size: 16
	block_size: 32
	compaction_speed: 1000
	compression: yes
