# stockdb 容器内配置文件（覆盖发行包默认）
#
# 与发行包默认的唯一差异：server.ip = 0.0.0.0（容器内必须监听所有接口，
# 才能被 Docker 端口映射对外暴露）。其余保持发行版默认。
#
# 注意事项：
#   - data 数据目录通过 entrypoint.sh 软链到 /data 卷，不在此文件配置。
#   - auth 开启后，HTTP/MCP 客户端需在 stock_sdk.init(host, port, password)
#     或请求参数中携带密码；未启用则无需。
#   - readonly: yes 会强制只读，防止误写；如要开启请去掉注释。

# stock config
# Indent nested config with tabs.

work_dir = ./
pidfile = ./stockdb.pid

server:
	port: 7899
	ip: 0.0.0.0
	#auth: this-is-a-very-strong-password-32ch
	#readonly: yes
	#slowlog_timeout: 5

replication:
	binlog: yes
	sync_speed: -1

logger:
	level: warn
	output: log.txt
	rotate:
		size: 1000000000

leveldb:
	cache_size: 500
	write_buffer_size: 16
	block_size: 32
	compaction_speed: 1000
	compression: yes
