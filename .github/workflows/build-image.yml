# free-stockdb 镜像构建 — 手动触发 + 上游 tag 变化自动触发
#
# 用法：
#   1. 在 fork 仓库 Settings → Secrets → Actions 里加 GH_PAT（GitHub PAT，
#      权限勾选 write:packages）
#   2. 仓库 Actions 页 → 本 workflow → Run workflow（手动触发）
#   3. 产物（amd64 + arm64 双架构单镜像，0.5.0 起 stockdb+webui 合一）：
#        ghcr.io/awoeyiwuyua/free-stockdb:<version>
#        ghcr.io/awoeyiwuyua/free-stockdb:latest
#
# 版本升级：上游发新版 → Sync fork → 改 docker/Dockerfile 的 ARG VERSION
#（及对应 SHA256 / GH_TAG_ENCODED）→ 重新 Run workflow

name: Build & Push stockdb images

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（必须与 docker/Dockerfile 的 ARG VERSION 一致）'
        required: false
        default: '0.3.1'
  push:
    tags:
      - 'v*'
    paths:
      - 'docker/**'

env:
  REGISTRY: ghcr.io
  # 固定包名，避免随仓库名漂移（fork 仓库名带 -docker 后缀时也不会改变）
  IMAGE_NAME: free-stockdb

jobs:
  build-stockdb:
    name: Build & push single image (stockdb + webui)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -oP '^ARG VERSION=\K.*' docker/Dockerfile | head -1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
        continue-on-error: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-pybao:
    name: Verify pybao import (amd64+arm64)
    needs: build-stockdb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # 拉取刚推的单镜像，两种架构各自在容器内 import stockdb（pybao abi3.so），
      # 验证对应架构的 manylinux-x64(glibc)/alpine-arm64(musl) 二进制确实可加载。
      - name: Verify pybao import (linux/amd64)
        run: |
          docker run --rm --entrypoint python \
            --platform linux/amd64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            -c "import stockdb; print('amd64 ok')"

      - name: Verify pybao import (linux/arm64)
        run: |
          docker run --rm --entrypoint python \
            --platform linux/arm64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            -c "import stockdb; print('arm64 ok')"
