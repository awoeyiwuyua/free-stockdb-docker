# stockdb-ai 镜像构建 — 手动触发
#
# 用法：
#   1. 在 fork 仓库 Settings → Secrets → Actions 里加 GH_PAT（GitHub PAT，
#      权限勾选 write:packages）
#   2. 仓库 Actions 页 → 本 workflow → Run workflow（手动触发）
#   3. 产物（amd64 + arm64 双架构单镜像，0.5.0 起 stockdb+webui 合一）：
#        ghcr.io/awoeyiwuyua/stockdb-ai:<面板版本>   （0.9.10 起：tag 跟随
#        stockdb-ai 面板版本 WEBUI_VERSION，不再用上游引擎版本）
#        ghcr.io/awoeyiwuyua/stockdb-ai:latest
#
# 两个版本各司其职（0.9.10 拆分明晰）：
#   - 镜像 tag = 面板版本（stockdb-ai/config.py 的 WEBUI_VERSION，input 可覆盖）
#   - build-args VERSION = 上游引擎 release 版本（docker/Dockerfile 的 ARG VERSION，
#     仅用于下载引擎包，与镜像 tag 无关）
# 上游引擎发新版 → 改 docker/Dockerfile 的 ARG VERSION（及 SHA256 / GH_TAG_ENCODED）；
# 面板发新版 → 改 stockdb-ai/config.py 的 WEBUI_VERSION。

name: Build & Push stockdb images

# 发布纪律（docs/release-policy.md）：镜像构建低频、仅手动触发。
# 发布检查单通过后手动 Run workflow；tag v* 只作发布历史标记，不自动触发构建。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（镜像 tag；默认取 stockdb-ai/config.py 的 WEBUI_VERSION）'
        required: false
        default: '0.9.10'

env:
  REGISTRY: ghcr.io
  # 0.9.10 修正：与 docker/docker-compose.yml 引用对齐（0.9.7 更名 stockdb-ai 后
  # 此处仍是旧名 free-stockdb，导致构建产物与部署 compose 拉取不一致）
  IMAGE_NAME: stockdb-ai

jobs:
  build-stockdb:
    name: Build & push single image (stockdb + webui)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve versions
        id: version
        shell: bash
        run: |
          # 镜像 tag 版本 = stockdb-ai 面板版本（input 可覆盖；缺省读 config.py）
          RELEASE="${{ github.event.inputs.version }}"
          if [ -z "$RELEASE" ]; then
            RELEASE="$(grep -oP 'WEBUI_VERSION: str = "\K[^"]+' stockdb-ai/config.py | head -1)"
          fi
          # 上游引擎包版本 = Dockerfile ARG VERSION（仅供下载引擎 release）
          ENGINE="$(grep -oP '^ARG VERSION=\K.*' docker/Dockerfile | head -1)"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
        continue-on-error: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.engine }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.release }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-pybao:
    name: Verify pybao import (amd64+arm64)
    needs: build-stockdb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # 拉取刚推的单镜像，两种架构各自在容器内 import pybao 三模块
      # （stockdb/zhibiao/zb_core 的 abi3.so），验证对应架构的
      # manylinux-x64(glibc)/alpine-arm64(musl) 二进制确实可加载。
      # zhibiao/zb_core 为 get_indicators/get_board_members 的运行时依赖。
      # 0.9.10 修正：采集/领域模块已迁 storage/providers/quote_sources + core/*
      # （0.9.8/0.9.9 迁移后此处 import auction_collect 等旧路径会 ImportError）。
      - name: Verify pybao import (linux/amd64)
        run: |
          docker run --rm --entrypoint python \
            --platform linux/amd64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            -c "import stockdb, zb_core, zhibiao; import sys; sys.path.insert(0, '/opt/webui'); import storage.providers.quote_sources, core.auction_metrics, core.auction_list; import duckdb; print('amd64 pybao + warehouse ok')"

      - name: Verify pybao import (linux/arm64)
        run: |
          docker run --rm --entrypoint python \
            --platform linux/arm64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            -c "import stockdb, zb_core, zhibiao; import sys; sys.path.insert(0, '/opt/webui'); import storage.providers.quote_sources, core.auction_metrics, core.auction_list; import sys as s; exec(\"try:
 import duckdb
 print('arm64 pybao + warehouse ok')
except ImportError:
 print('arm64 pybao ok, duckdb unavailable')\")"

  test-spa:
    name: SPA 前端构建 + 单测（Node，离线）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stockdb-ai/spa/package-lock.json

      - name: npm ci
        working-directory: stockdb-ai/spa
        run: npm ci --no-audit --no-fund

      - name: Vitest 单测
        working-directory: stockdb-ai/spa
        run: npm run test

      - name: Vite 构建（验证可编译出 dist）
        working-directory: stockdb-ai/spa
        run: npm run build

  test-mcp:
    name: Python 单测（离线，无 pybao 依赖）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run MCP unit tests
        working-directory: stockdb-ai
        run: uv run --project .. python -m unittest interfaces.mcp.test_stockdb_mcp_server -v

      - name: Run ops + auction + warehouse unit tests
        working-directory: stockdb-ai
        run: uv run --project .. python -m unittest test_ops test_quote_sources test_auction_metrics test_auction_list test_warehouse -v
