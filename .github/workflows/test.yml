# 轻量测试门禁：每次 push main / PR 都跑（不构建镜像）。
# 镜像构建只在 Phase 收口时手动触发 build-image.yml（低频策略）。
name: Tests (Python + SPA)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'stockdb-ai/**'
      - '.github/workflows/test.yml'

jobs:
  python-tests:
    name: Python 单测（离线）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 0.10.0 起 duckdb 为首个第三方依赖：uv sync --frozen 按 uv.lock 精确复现
      # （本机与 CI 同源，版本不漂移）；pyproject/uv.lock 均在仓库根。
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run MCP unit tests
        working-directory: stockdb-ai
        run: uv run --project .. python -m unittest interfaces.mcp.test_stockdb_mcp_server -v

      - name: Run ops unit tests
        working-directory: stockdb-ai
        run: uv run --project .. python -m unittest test_ops -v

      - name: Run auction collector tests
        working-directory: stockdb-ai
        run: uv run --project .. python -m unittest test_quote_sources test_auction_metrics test_auction_list test_records test_layer_boundaries -v

      - name: Run warehouse tests
        working-directory: stockdb-ai
        run: uv run --project .. python -m unittest test_warehouse test_research test_research_store test_tool_groups_trace -v

  spa-tests:
    name: SPA 前端（构建 + Vitest）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stockdb-ai/spa/package-lock.json

      - name: npm ci
        working-directory: stockdb-ai/spa
        run: npm ci --no-audit --no-fund

      - name: Vitest 单测
        working-directory: stockdb-ai/spa
        run: npm run test

      - name: Vite 构建
        working-directory: stockdb-ai/spa
        run: npm run build
